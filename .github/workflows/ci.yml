name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    typescript:
        name: TypeScript
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

            - run: bun install --frozen-lockfile

            - run: bun turbo typecheck test build --filter='!@maple/ingest'

    shell:
        name: Shell
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

            # shellcheck is preinstalled on the ubuntu-latest runner image.
            - name: shellcheck
              run: shellcheck scripts/install.sh scripts/uninstall.sh scripts/build-local-binary.sh

            # Syntax-check the POSIX installers against the actual /bin/sh they claim.
            - name: sh -n
              run: |
                  sh -n scripts/install.sh
                  sh -n scripts/uninstall.sh

    # Self-host fork: `knip` and `service-map-perf` upstream jobs are dropped.
    # Knip is upstream's dead-code hygiene gate — not signal we benefit from.
    # Service Map Perf is a Playwright/Chromium rendering benchmark that
    # boots a synthetic dev server; not relevant to whether self-host builds
    # work. The full upstream `ci.yml` lives at Makisuo/maple if needed.
    #
    # Note: the `apps/ingest` Rust crate is built and tested by
    # `.github/workflows/ingest-rust-tests.yml` (also disabled on this fork).
